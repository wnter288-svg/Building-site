# Автодеплой фронта на Cloudflare Pages.
#
# Срабатывает только на main — то есть после мерджа PR из dev.
# Пока нет кода в frontend/ или не заведены секреты, workflow
# завершается успешно, ничего не делая. Что нужно настроить — в
# docs/DEPLOY.md.
name: Deploy frontend

on:
  push:
    branches: [main]
  # Позволяет запустить деплой руками из вкладки Actions.
  workflow_dispatch:

# Два деплоя одновременно не нужны: новый отменяет предыдущий.
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Готовы ли к деплою
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ready=true
          if [ ! -f frontend/package.json ]; then
            echo "::notice::Во frontend/ ещё нет проекта — деплой пропущен"
            ready=false
          fi
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::Нет секретов CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — деплой пропущен (см. docs/DEPLOY.md)"
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm ci

      - name: Сборка
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm run build

      # Astro и Vite кладут результат в dist/. Если сборщик поменяется —
      # поправь путь здесь и в docs/DEPLOY.md.
      - name: Публикация на Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=building-site --branch=main
