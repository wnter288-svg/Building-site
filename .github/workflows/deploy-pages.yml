# Публикация сайта на GitHub Pages.
#
# Запускается только на main — то есть после мерджа PR из dev.
# Пуш в dev на сайт ничего не выкатывает, в этом смысл разделения веток.
#
# Пока в frontend/ нет проекта, публикуется страница-заглушка: так виден
# сам конвейер, ещё до первой строчки вёрстки. Как только у Тимофея
# появится сборка — публиковаться начнёт она, без правок этого файла.
#
# Адрес сайта: https://wnter288-svg.github.io/Building-site/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; начатый не прерываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Есть ли проект во frontend/
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Во frontend/ пока нет проекта — публикуем заглушку"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: '20'

      - name: Установка зависимостей
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci || npm install

      # ВАЖНО: сайт живёт не в корне домена, а по адресу /Building-site/.
      # Сборщику нужно об этом сказать, иначе стили и скрипты дадут 404:
      #   Astro — base: '/Building-site/' в astro.config.mjs
      #   Vite  — base: '/Building-site/' в vite.config.js
      # Подробности в docs/DEPLOY.md.
      - name: Сборка
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Проверка результата сборки
        if: steps.check.outputs.exists == 'true'
        run: |
          if [ ! -d frontend/dist ]; then
            echo "::error::Сборка не создала frontend/dist. Проверь настройки сборщика или поправь путь в этом workflow."
            exit 1
          fi

      - name: Страница-заглушка
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p frontend/dist
          cat > frontend/dist/index.html <<'HTML'
          <!doctype html>
          <html lang="uk">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex">
            <title>Сайт у розробці</title>
            <style>
              :root { color-scheme: light dark; }
              body {
                margin: 0; min-height: 100vh;
                display: grid; place-items: center;
                font: 16px/1.6 system-ui, sans-serif;
                background: #f6f6f4; color: #1a1a1a;
                padding: 24px;
              }
              @media (prefers-color-scheme: dark) {
                body { background: #16181d; color: #e8e8e6; }
              }
              main { max-width: 32rem; text-align: center; }
              h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
              p { margin: 0; opacity: .7; }
            </style>
          </head>
          <body>
            <main>
              <h1>Сайт у розробці</h1>
              <p>Конвеєр публікації працює — тут з'явиться лендинг.</p>
            </main>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
