# Проверки на каждый push в dev и на каждый PR в main.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]

jobs:
  secrets:
    name: Секреты не в репозитории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: .env не должен быть в git
        run: |
          if git ls-files --error-unmatch .env frontend/.env 2>/dev/null; then
            echo "::error::.env отслеживается git — секреты утекут. Убери: git rm --cached .env"
            exit 1
          fi
          echo "OK: .env не отслеживается"

      - name: Поиск захардкоженных секретов
        run: |
          # .github исключён: там секреты идут через ${{ secrets.* }},
          # а сам этот файл иначе нашёл бы собственный шаблон поиска.
          if grep -rInE '(API_KEY|SECRET|PASSWORD|BOT_TOKEN|ACCESS_TOKEN)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,}' \
               --include='*.js' --include='*.ts' --include='*.tsx' --include='*.astro' \
               --include='*.json' --include='*.yml' --include='*.mjs' \
               --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github \
               --exclude=package-lock.json . ; then
            echo "::error::Похоже на секрет в коде. Перенеси его в .env"
            exit 1
          fi
          echo "OK: секретов в коде не найдено"

  frontend:
    name: Сборка и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Есть ли что собирать
        id: check
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "frontend пустой — пропускаем"; fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Проверка типов
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npx astro check

      - name: Сборка
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Аудит зависимостей
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  docs:
    name: Документация на месте
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Обязательные файлы существуют
        run: |
          missing=0
          for f in README.md CLAUDE.md TODO.md \
                   docs/PROJECT.md docs/MVP.md docs/STRUCTURE.md \
                   docs/API.md docs/PROGRESS.md docs/HANDOFF.md \
                   docs/DEPLOY.md docs/RECOMMENDATIONS.md; do
            if [ ! -f "$f" ]; then echo "::error::Нет файла $f"; missing=1; fi
          done
          exit $missing
